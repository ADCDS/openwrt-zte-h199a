%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zte,zx279128s-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279128S Ethernet datapath

maintainers:
  - TBD

description: |
  The ZX279128S has four GE MACs, one register window each, 0x40000 apart
  starting at 0x92200000. They sit in front of a hardware buffer manager
  (BM) and a traffic manager (TM). These blocks hand received frames to the
  CPU through descriptor rings and 2 KiB buffers in a fixed DDR window. A
  frame's ingress port comes from a field in its descriptor (the value is
  the MAC index plus one).

  The driver (drivers/net/ethernet/zte/zx279128-eth.c) binds to this node.
  It creates one netdev for the port whose MAC window is reg[0] (MAC 0) and
  one more for each of the other three ports. Each netdev attaches the PHY
  named by its ethernet-ports/port@N node, in the interface mode given by
  that node's phy-mode.

  Every datapath register block the driver uses is a named reg entry, at
  the size the driver maps. The windows are ioremapped, not claimed: the
  MDIO driver's debug dump and the packet-processor table code map some of
  them too. The SPA block (npp + 0x14000) and the port attach block
  (npp + 0x19000) are part of the npp window, as in the vendor's npp node.
  For a device tree that names none of them (reg = MAC 0 only), the driver
  falls back to the fixed addresses and logs which names were missing.

  The buffer pools, free lists and descriptor rings are in a reserved DDR
  window given by memory-region; see that property for the layout.

  TODO: still not described or not final:
    - The vendor DT splits these blocks into separate pon, npp, sw, tm, pp,
      idm and gephy nodes, and gives npp two ranges (0x921c0000 +0x8000 and
      0x921cc000 +0x34000) around the IDM block at 0x921c8000. The npp entry
      here is the single 128 KiB window the driver maps, which spans that
      IDM hole.
    - The experimental PP table code (zx279128-pp.c, off by default) still
      maps CLA, PonPp and the PM block (0x9239c000) by fixed address; PM is
      not a reg entry yet.
    - No clocks or resets are described. In the vendor DT the datapath
      blocks have no clocks property either, and their gating is in TOPCRM
      (0x94000000).

properties:
  compatible:
    const: zte,zx279128s-eth

  reg:
    items:
      - description:
          MAC 0 register window. The primary netdev serves the port whose
          MAC window this is.
      - description: MAC 1 register window
      - description: MAC 2 register window
      - description: MAC 3 register window
      - description: Datapath (fabric) reset block
      - description: Datapath global configuration block
      - description:
          NPP block (128 KiB), including the SPA queue and protocol-trap
          registers at +0x14000 and the port attach registers at +0x19000
      - description: Traffic manager configuration and CPU RX rings
      - description: Traffic manager descriptor release and queue table
      - description: Buffer manager
      - description: Queue manager (QMG)
      - description: Traffic manager queues and the CPU TX ring
      - description: Packet processor command block
      - description: Packet processor bridge (SBRG)
      - description: Packet processor classifier (CLA)
      - description: PonPp configuration block

  reg-names:
    items:
      - const: mac0
      - const: mac1
      - const: mac2
      - const: mac3
      - const: fabric
      - const: glb
      - const: npp
      - const: tmc
      - const: tmd
      - const: bm
      - const: qmg
      - const: tmq
      - const: pp
      - const: sbrg
      - const: cla
      - const: ponpp

  interrupts:
    minItems: 1
    items:
      - description:
          Traffic manager interrupt that schedules CPU RX (NAPI). It is the
          only interrupt the datapath uses.
      - description:
          IDM block interrupt. Requested only by the debug IRQ probe
          (CONFIG_ZX279128_ETH_DEBUG). IDM is a separate block at
          0x921c8000 and is not in the working RX path.
      - description: GE port 0 PHY interrupt. Debug IRQ probe only.
      - description: GE port 1 PHY interrupt. Debug IRQ probe only.
      - description: GE port 2 PHY interrupt. Debug IRQ probe only.
      - description: GE port 3 PHY interrupt. Debug IRQ probe only.

  interrupt-names:
    # TODO: "idm" belongs to a different block, and gephy0..3 are most likely
    # per-PHY link interrupts that should be "interrupts" in the
    # ethernet-phy@N nodes under the MDIO bus. Drop them here once that is
    # confirmed.
    minItems: 1
    items:
      - const: tm
      - const: idm
      - const: gephy0
      - const: gephy1
      - const: gephy2
      - const: gephy3

  memory-region:
    maxItems: 1
    description: |
      The datapath's DDR window. The region must be no-map (the driver maps
      parts of it with ioremap), at least 16 MiB, 1 MiB aligned and below
      4 GiB (the TM takes 32-bit addresses). The hardware is programmed
      with fixed offsets from its base, the layout the vendor U-Boot uses at
      0x41000000:

        +0x000000  BM pool 0, 2048 x 2 KiB buffers           (tmc +0xf4)
        +0x400000  BM pool 1, 512 x 2 KiB buffers            (tmc +0xf8)
        +0x800000  pool 0 free list, 2048 big-endian u16     (tmc +0xe8)
        +0x808000  pool 1 free list, 512 big-endian u16      (tmc +0xec)
        +0xa00000  16 CPU RX descriptor rings, 1024 x 16 B   (tmc +0xf0)
        +0xb00000  area used only by the TM, extent unknown  (tmq +0x50)
        +0xc00000  CPU TX descriptor ring, 1024 x 16 B       (tmq +0x60)

      The whole 16 MiB is required, not just the structures the driver
      maps, because the extent of the area at +0xb00000 is unknown. With a
      1 MiB aligned base every structure keeps the alignment it has at
      0x41000000, the only base run on hardware. Without memory-region the
      driver uses 0x41000000 and logs that it did.
      TODO - the stock kernel uses a different layout, in the top 18 MiB of
      DRAM (0x46e00000 with 128 MiB); this driver has not been run with it.

  phy-handle:
    $ref: /schemas/types.yaml#/definitions/phandle
    deprecated: true
    description:
      Legacy single-port form. Used for the primary netdev only when its
      ethernet-ports/port@N node has no phy-handle.

  phy-mode:
    $ref: ethernet-controller.yaml#/properties/phy-mode
    deprecated: true
    const: rgmii
    description:
      Legacy form. Used for a port whose ethernet-ports/port@N node has no
      phy-mode of its own.

  ethernet-ports:
    type: object
    additionalProperties: false

    properties:
      '#address-cells':
        const: 1

      '#size-cells':
        const: 0

    patternProperties:
      "^port@[0-3]$":
        type: object
        description:
          One physical GE port. A port without nvmem-cells gets an address
          derived from the first port that has one. The locally-administered
          bit is set and the port index goes into the high nibble of byte 3.
        $ref: ethernet-controller.yaml#
        unevaluatedProperties: false

        properties:
          reg:
            minimum: 0
            maximum: 3
            description:
              MAC index N. The descriptor ingress-port field reads N + 1.
              On the H199A the port's PHY is at MDIO address 10 + N.

          phy-handle: true

          phy-mode:
            # TODO: rgmii is the only mode the driver supports; it refuses
            # any other value. If the PHYs are the SoC-integrated GE PHYs
            # (the vendor DT has a gephy128s block at 0x9b000000),
            # "internal" or "gmii" may be the correct description. Widen
            # this once that is confirmed.
            const: rgmii
            description:
              Interface to this port's PHY. Without it the node-level
              phy-mode is used, and without either, rgmii.

          nvmem-cells:
            maxItems: 1

          nvmem-cell-names:
            const: mac-address

        required:
          - reg
          - phy-handle

    required:
      - '#address-cells'
      - '#size-cells'

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - memory-region
  - ethernet-ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ethernet@92200000 {
        compatible = "zte,zx279128s-eth";
        reg = <0x92200000 0x1000>, <0x92240000 0x1000>,
              <0x92280000 0x1000>, <0x922c0000 0x1000>,
              <0x92000000 0x1000>, <0x92040000 0x1000>,
              <0x921c0000 0x20000>, <0x92340000 0x1000>,
              <0x92344000 0x1000>, <0x92348000 0x1000>,
              <0x9234c000 0x1000>, <0x92350000 0x1000>,
              <0x92380000 0x1000>, <0x92388000 0x1000>,
              <0x9238c000 0x1000>, <0x923a0000 0x1000>;
        reg-names = "mac0", "mac1", "mac2", "mac3", "fabric", "glb",
                    "npp", "tmc", "tmd", "bm", "qmg", "tmq", "pp",
                    "sbrg", "cla", "ponpp";
        phy-handle = <&phy0>;
        phy-mode = "rgmii";
        memory-region = <&eth_bufs>;

        interrupts = <GIC_SPI 36 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 38 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 39 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 40 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 41 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 42 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "tm", "idm", "gephy0", "gephy1",
                          "gephy2", "gephy3";

        ethernet-ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                phy-handle = <&phy0>;
                phy-mode = "rgmii";
                nvmem-cells = <&macaddr_tag_2>;
                nvmem-cell-names = "mac-address";
            };

            port@1 {
                reg = <1>;
                phy-handle = <&phy1>;
                phy-mode = "rgmii";
            };

            port@2 {
                reg = <2>;
                phy-handle = <&phy2>;
                phy-mode = "rgmii";
            };

            port@3 {
                reg = <3>;
                phy-handle = <&phy3>;
                phy-mode = "rgmii";
                nvmem-cells = <&macaddr_tag_3>;
                nvmem-cell-names = "mac-address";
            };
        };
    };
...
