%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/zte,zx279128s-crm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279128S clock and reset manager (CRM)

maintainers:
  - Adriel Santos <adriel@adriel.eu>

description: |
  The ZX279128S keeps its clock and reset controls in several clock/reset
  manager blocks: TOPCRM (0x94000000), CRM1 (0x94100000), CRM2
  (0x94200000), LSP0CRPM (0x94400000) and LSP1CRPM (0x9a100000). This node
  covers the four blocks whose fields are modelled today; each reg entry is
  one whole 4 KiB block. Every field is an entry of the stock kernel's own
  clock tables (zx279127_{top,lsp0,lsp1}_clocks_init), restricted to the
  clocks this SoC's consumers take.

  Clocks, one-cell specifier, indices in
  include/dt-bindings/clock/zte,zx279128s-crm.h:

    - ZX_CRM_SPI_WCLK (0): SPI flash controller working clock. Gate in
      LSP0CRPM + 0x18 bit 1, after a divider in LSP0CRPM + 0x18 bits
      [16:11] (divisor = field + 1, not a power of two), fed by
      ZX_CRM_LSP0_WCLK.
    - ZX_CRM_SPI_PCLK (1): SPI flash controller peripheral clock. Gate in
      LSP0CRPM + 0x18 bit 0, fed by ZX_CRM_LSP0_PCLK.
    - ZX_CRM_LSP0_WCLK (2): shared LSP0 working-clock parent. Gate in
      TOPCRM + 0x14 bit 13, fed by the first "clocks" entry.
    - ZX_CRM_LSP0_PCLK (3): shared LSP0 peripheral-clock parent. Gate in
      TOPCRM + 0x14 bit 11, fed by the second "clocks" entry.
    - ZX_CRM_LSP1_WCLK (4): shared LSP1 100 MHz working-clock parent. Gate
      in TOPCRM + 0x14 bit 7, fed by the first "clocks" entry.
    - ZX_CRM_LSP1_PCLK (5): shared LSP1 peripheral-clock parent. Gate in
      TOPCRM + 0x14 bit 5, fed by the second "clocks" entry.
    - ZX_CRM_MDIO_WCLK (6): MDIO controller working clock. Gate in
      LSP1CRPM + 0x04 bit 1, after a divider in LSP1CRPM + 0x04 bits [17:11]
      (divisor = field + 1), fed by ZX_CRM_LSP1_WCLK. The stock tree's
      "<&lsp1crpm 1>".
    - ZX_CRM_MDIO_PCLK (7): MDIO controller peripheral clock. Gate in
      LSP1CRPM + 0x04 bit 0, fed by ZX_CRM_LSP1_PCLK.
    - ZX_CRM_GPIO_PCLK (8): GPIO controller peripheral clock. Gate in
      LSP0CRPM + 0x1c bit 0, fed by ZX_CRM_LSP0_PCLK.

  The two "clocks" inputs serve both LSP blocks: in the stock tables the
  LSP0 and LSP1 100 MHz gates share one parent (clk_100m) and the two APB
  gates share another (matrix_pclk).

  Every gate above is on when the boot firmware hands over, and an access
  to an unclocked block on this SoC hangs it, so the provider never gates
  them. PLLs and source selection are left as the firmware set them; the
  two "clocks" inputs describe the rates the firmware leaves behind.

  Resets, one-cell specifier, indices in
  include/dt-bindings/reset/zte,zx279128s-crm.h. All are in CRM1 + 0x74
  and are active low (a clear bit holds the block in reset):

    - ZX_CRM_RST_PCIE0 (0): PCIe controller 0, bit 0.
    - ZX_CRM_RST_PCIE1 (1): PCIe controller 1, bit 3.

  The other bits of CRM1 + 0x74 are not identified.

  The blocks are shared with other nodes: the system reset trigger at
  TOPCRM + 0x44 has its own node (zte,zx279128s-reboot), because the
  generic syscon-reboot was tried on this board and hung it.

  TODO: not modelled yet:
    - CRM2. The stock clock tables have no CRM2 entry at all; the only CRM2
      field this port touches is +0x0c, a pin-mux word the PCIe sequence
      edits.
    - The PCIe clock enables (TOPCRM + 0x08 bits 13-15 and 25-27, which are
      not in the stock clock tables either) and the PCIe configuration
      fields (TOPCRM + 0x24, CRM1 + 0x70). The PCIe nodes keep their own
      crm0..crm2 reg entries for them.
    - The other LSP0/LSP1 clocks (UART, timers, I2C, SSP, TDM, ...). Their
      consumers here take fixed clocks or have no node.

properties:
  compatible:
    const: zte,zx279128s-crm

  reg:
    items:
      - description: TOPCRM block
      - description: CRM1 block
      - description: LSP0CRPM block
      - description: LSP1CRPM block

  reg-names:
    items:
      - const: topcrm
      - const: crm1
      - const: lsp0crpm
      - const: lsp1crpm

  clocks:
    items:
      - description:
          LSP0 working-clock reference, 100 MHz as set up by the boot
          firmware (pll_lsp / 10)
      - description: Matrix peripheral-clock reference (APB, 125 MHz)

  clock-names:
    items:
      - const: lsp0-wclk
      - const: lsp0-pclk

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@94000000 {
        compatible = "zte,zx279128s-crm";
        reg = <0x94000000 0x1000>,
              <0x94100000 0x1000>,
              <0x94400000 0x1000>,
              <0x9a100000 0x1000>;
        reg-names = "topcrm", "crm1", "lsp0crpm", "lsp1crpm";
        clocks = <&lsp0_ref>, <&apb_pclk>;
        clock-names = "lsp0-wclk", "lsp0-pclk";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
...
