%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/zte,zx279128s-spifc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279128S SPI memory controller

maintainers:
  - Adriel Santos <adriel@adriel.eu>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: zte,zx279128s-spifc
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    items:
      - description: Peripheral register clock
      - description: SPI working clock
  clock-names:
    items:
      - const: pclk
      - const: wclk
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false
